# 主站根域：youju.chat（分享落地页 /post/{id}、/user/{id} + 隐私/条款）
server {
    listen 443 ssl;
    server_name youju.chat;

    ssl_certificate     /etc/letsencrypt/live/youju.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youju.chat/privkey.pem;

    # 分享落地页：/post/{id}、/user/{id} → 后端 SSR（动态 OG 标签，微信/卡片抓取渲染）；
    # 保留 /share/index.html 仅作根路径首页展示。
    location ~ ^/(post|user)/(\d+)/?$ {
        proxy_pass http://youju-backend:3000/v1/share/$1/$2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 站点根路径 → 展示分享落地页首页
    location = / {
        root /usr/share/nginx/html;
        try_files /share/index.html =404;
    }

    # 分享静态资源（logo/og 卡片等）
    location /share/ {
        alias /usr/share/nginx/html/share/;
    }

    # 用户协议/隐私别名：/agreement、/user-agreement → /terms/（审核材料与分享链接统一可达）
    location = /agreement {
        return 301 /terms/;
    }

    location = /user-agreement {
        return 301 /terms/;
    }

    # 静态页面（隐私政策等公开网页）
    location = /privacy {
        return 301 /privacy/;
    }

    location /privacy/ {
        alias /usr/share/nginx/html/privacy/;
        index index.html;
    }

    location = /terms {
        return 301 /terms/;
    }

    location /terms/ {
        alias /usr/share/nginx/html/terms/;
        index index.html;
    }
}

# 新主域名（API）：api.youju.chat
server {
    listen 443 ssl;
    server_name api.youju.chat;

    ssl_certificate     /etc/letsencrypt/live/api.youju.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.youju.chat/privkey.pem;

    location / {
        # 用容器名而非 compose 服务名：backend 容器重建后可能丢失服务别名，
        # 容器名 youju-backend 由 container_name 固定，解析始终可靠
        proxy_pass http://youju-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 用户协议/隐私别名：/agreement、/user-agreement → /terms/
    location = /agreement {
        return 301 /terms/;
    }

    location = /user-agreement {
        return 301 /terms/;
    }

    # 静态页面（隐私政策等公开网页）
    location = /privacy {
        return 301 /privacy/;
    }

    location /privacy/ {
        alias /usr/share/nginx/html/privacy/;
        index index.html;
    }

    location = /terms {
        return 301 /terms/;
    }

    location /terms/ {
        alias /usr/share/nginx/html/terms/;
        index index.html;
    }
}

# 旧域名过渡兼容：App 上架稳定、AGC 材料链接全部更新到新域名后可整块移除
