server {
    listen 443 ssl;
    server_name api.mindtype.cn;

    ssl_certificate     /etc/letsencrypt/live/api.mindtype.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mindtype.cn/privkey.pem;

    location / {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态页面（隐私政策等公开网页）
    location = /privacy {
        return 301 /privacy/;
    }

    location /privacy/ {
        alias /usr/share/nginx/html/privacy/;
        index index.html;
    }

    location = /terms {
        return 301 /terms/;
    }

    location /terms/ {
        alias /usr/share/nginx/html/terms/;
        index index.html;
    }
}
