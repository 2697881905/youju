server {
    listen 80;
    # 主站根域 + API 子域（ACME 续期验证同样适用于这几个域名）
    server_name youju.chat api.youju.chat;

    # Let's Encrypt ACME 校验目录（certbot webroot 模式写入）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余请求全部 301 跳转到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
