services:
  mysql:
    image: mysql:8.0
    container_name: youju-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: youju
      MYSQL_USER: youju
      MYSQL_PASSWORD: youju
    ports:
      - "3306:3306"
    volumes:
      - youju_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  # 后端应用（2026-11-05 补全：此前服务器上的 youju-backend 容器是手工 docker run 的
  # 「野生」容器，不归 compose 管，导致改 .env 后无法重建。现在收编进 compose 统一部署：
  #   1) env_file 注入生产配置（含 AI_API_BASE/AI_API_KEY/AI_MODEL 三键）
  #   2) 不声明 ports——youju-nginx 在同一网络按容器名反代 youju-backend:3000
  #   3) 网络挂外部 youju_default（nginx/mysql 现有容器所在网络），container_name
  #      保持 youju-backend，DNS 名不变，nginx 的 proxy_pass 零改动
  # 注意：只重建本服务用 `docker compose up -d --build backend`，mysql/nginx 不受影响。
  backend:
    build: .
    container_name: youju-backend
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - youju_ext

networks:
  youju_ext:
    external: true
    name: youju_default

volumes:
  youju_mysql_data:
