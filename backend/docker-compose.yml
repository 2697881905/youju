services:
  mysql:
    image: mysql:8.0
    container_name: youju-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: youju
      MYSQL_USER: youju
      MYSQL_PASSWORD: youju
    ports:
      - "3306:3306"
    volumes:
      - youju_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  youju_mysql_data:
