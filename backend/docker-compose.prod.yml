services:
  mysql:
    image: mysql:8.0
    container_name: bbb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bigbluebook
      MYSQL_USER: bigbluebook
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  backend:
    build: .
    container_name: bbb-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mysql
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: bbb-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/web:/var/www/certbot:ro

volumes:
  mysql_data:
