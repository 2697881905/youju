services:
  mysql:
    image: mysql:8.0
    container_name: youju-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: youju
      MYSQL_USER: youju
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=384M
    deploy:
      resources:
        limits:
          memory: 1g

  backend:
    build: .
    container_name: youju-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mysql
    expose:
      - "3000"
    environment:
      - NODE_OPTIONS=--max-old-space-size=512
    deploy:
      resources:
        limits:
          memory: 1g

  nginx:
    image: nginx:alpine
    container_name: youju-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx-static:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/web:/var/www/certbot:ro
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  mysql_data:
