<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; min-height: 100vh; background: linear-gradient(160deg, #f6f8fc 0%, #eef2fa 100%); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: #fff; border-radius: 20px; box-shadow: 0 12px 40px rgba(20,40,90,.10); max-width: 420px; width: 100%; padding: 40px 32px 32px; text-align: center; }
  .logo { width: 72px; height: 72px; border-radius: 18px; overflow: hidden; background: #fff; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 4px 14px rgba(0,0,0,.08); }
  .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 { font-size: 22px; color: #1a1a2e; margin-bottom: 8px; }
  .desc { font-size: 14px; color: #5a6a85; line-height: 1.7; margin-bottom: 8px; }
  .badge { display: inline-block; margin-top: 4px; padding: 4px 14px; border-radius: 999px; background: #eef3ff; color: #4369e2; font-size: 13px; font-weight: 500; }
  .foot { margin-top: 22px; font-size: 12px; color: #a0abc4; }
</style>

<body>
  <div class="card">
    <div class="logo"><img src="/share/logo.png" alt="有据" width="72" height="72"></div>
    <h1 id="typeTitle">有据个人理性内容分享</h1>
    <p class="desc">真实经验，有理有据。<br>这份内容来自「有据」，打开 App 查看完整内容。</p>
    <span class="badge" id="badge">#内容分享</span>
    <div class="foot">有据 · 用理性连接彼此</div>
  </div>
<script>
  (function () {
    var path = location.pathname || '';
    var idMatch = path.match(/^\/(post|user)\/(\d+)\/?$/i);
    var typeEl = document.getElementById('typeTitle');
    var badgeEl = document.getElementById('badge');
    if (idMatch) {
      var kind = idMatch[1].toLowerCase();
      if (kind === 'post') {
        typeEl.textContent = '有据 · 帖子分享';
        badgeEl.textContent = '#单帖分享';
      } else {
        typeEl.textContent = '有据 · 个人主页';
        badgeEl.textContent = '#作者主页';
      }
    }
  })();
</script>
