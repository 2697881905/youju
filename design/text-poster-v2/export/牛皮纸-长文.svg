<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><rect width="1080" height="1440" fill="#C7A379"/><rect x="0" y="0" width="1080" height="1440" fill="#C7A379"/><text x="184" y="436.8" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#2A1C0C" text-anchor="start">第一次装修最大的教</text><text x="184" y="552.32" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#2A1C0C" text-anchor="start">训是：灯光方案必须</text><text x="184" y="667.84" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#2A1C0C" text-anchor="start">在水电改造前定下</text><text x="184" y="783.36" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#2A1C0C" text-anchor="start">来。等吊顶封好再想</text><text x="184" y="898.88" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#2A1C0C" text-anchor="start">加射灯，只能在石膏</text><text x="184" y="1014.4" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#2A1C0C" text-anchor="start">板上开槽，多花两…</text><line x1="184" y1="260" x2="896" y2="260" stroke="#5A3C1C" stroke-width="1" shape-rendering="crispEdges" stroke-opacity="0.38"/><line x1="184" y1="1176" x2="896" y2="1176" stroke="#5A3C1C" stroke-width="1" shape-rendering="crispEdges" stroke-opacity="0.38"/><text x="896" y="1224" font-family="PingFang SC, Noto Sans SC, &quot;Helvetica Neue&quot;, sans-serif" font-size="26" font-weight="400" fill="#2A1C0C" text-anchor="end" fill-opacity="0.55">有据</text></svg>