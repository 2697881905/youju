<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><rect width="1080" height="1440" fill="#C7A379"/><rect x="0" y="0" width="1080" height="1440" fill="#C7A379"/><text x="184" y="423.59999999999997" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#2A1C0C" text-anchor="start">第一次装修最大的教训</text><text x="184" y="523.4399999999999" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#2A1C0C" text-anchor="start">是：灯光方案必须在水电</text><text x="184" y="623.28" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#2A1C0C" text-anchor="start">改造前定下来。等吊顶封</text><text x="184" y="723.12" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#2A1C0C" text-anchor="start">好再想加射灯，只能在石</text><text x="184" y="822.96" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#2A1C0C" text-anchor="start">膏板上开槽，多花两千</text><text x="184" y="922.8000000000001" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#2A1C0C" text-anchor="start">块，还留下一条补不平的</text><text x="184" y="1022.6400000000001" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#2A1C0C" text-anchor="start">缝。</text><line x1="184" y1="260" x2="896" y2="260" stroke="#5A3C1C" stroke-width="1" shape-rendering="crispEdges" stroke-opacity="0.38"/><line x1="184" y1="1176" x2="896" y2="1176" stroke="#5A3C1C" stroke-width="1" shape-rendering="crispEdges" stroke-opacity="0.38"/><text x="896" y="1224" font-family="PingFang SC, Noto Sans SC, &quot;Helvetica Neue&quot;, sans-serif" font-size="26" font-weight="400" fill="#2A1C0C" text-anchor="end" fill-opacity="0.55">有据</text></svg>