<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><rect width="1080" height="1440" fill="#F2E2A8"/><rect x="0" y="0" width="1080" height="1440" fill="#F2E2A8"/><text x="216" y="430.8" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#2A2410" text-anchor="start">第一次装修最大的</text><text x="216" y="546.32" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#2A2410" text-anchor="start">教训是：灯光方案</text><text x="216" y="661.84" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#2A2410" text-anchor="start">必须在水电改造前</text><text x="216" y="777.36" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#2A2410" text-anchor="start">定下来。等吊顶封</text><text x="216" y="892.88" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#2A2410" text-anchor="start">好再想加射灯，</text><text x="216" y="1008.4" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#2A2410" text-anchor="start">只能在石膏板上开…</text><rect x="192" y="316" width="4" height="792" fill="#C9A94E"/><text x="896" y="1224" font-family="PingFang SC, Noto Sans SC, &quot;Helvetica Neue&quot;, sans-serif" font-size="26" font-weight="400" fill="#2A2410" text-anchor="end" fill-opacity="0.55">有据</text></svg>