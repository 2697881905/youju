<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><rect width="1080" height="1440" fill="#F2E2A8"/><rect x="0" y="0" width="1080" height="1440" fill="#F2E2A8"/><text x="216" y="417.59999999999997" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#2A2410" text-anchor="start">第一次装修最大的教训</text><text x="216" y="517.4399999999999" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#2A2410" text-anchor="start">是：灯光方案必须在水</text><text x="216" y="617.28" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#2A2410" text-anchor="start">电改造前定下来。</text><text x="216" y="717.12" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#2A2410" text-anchor="start">等吊顶封好再想加射灯，</text><text x="216" y="816.96" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#2A2410" text-anchor="start">只能在石膏板上开槽，</text><text x="216" y="916.8000000000001" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#2A2410" text-anchor="start">多花两千块，还留下一</text><text x="216" y="1016.6400000000001" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#2A2410" text-anchor="start">条补不平的缝。</text><rect x="192" y="316" width="4" height="792" fill="#C9A94E"/><text x="896" y="1224" font-family="PingFang SC, Noto Sans SC, &quot;Helvetica Neue&quot;, sans-serif" font-size="26" font-weight="400" fill="#2A2410" text-anchor="end" fill-opacity="0.55">有据</text></svg>