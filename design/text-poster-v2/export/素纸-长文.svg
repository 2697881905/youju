<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><rect width="1080" height="1440" fill="#EFE9DC"/><rect x="0" y="0" width="1080" height="1440" fill="#EFE9DC"/><text x="200" y="365.67999999999995" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#241D12" text-anchor="start">第一次装修最大的教训</text><text x="200" y="465.52" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#241D12" text-anchor="start">是：灯光方案必须在水</text><text x="200" y="565.36" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#241D12" text-anchor="start">电改造前定下来。</text><text x="200" y="665.2" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#241D12" text-anchor="start">等吊顶封好再想加射</text><text x="200" y="765.0400000000001" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#241D12" text-anchor="start">灯，只能在石膏板上开</text><text x="200" y="864.8800000000001" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#241D12" text-anchor="start">槽，多花两千块，</text><text x="200" y="964.7200000000001" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#241D12" text-anchor="start">还留下一条补不平的</text><text x="200" y="1064.5600000000002" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#241D12" text-anchor="start">缝。</text><line x1="200" y1="1176" x2="880" y2="1176" stroke="#241D12" stroke-width="1" shape-rendering="crispEdges" stroke-opacity="0.22"/><line x1="200" y1="1186" x2="880" y2="1186" stroke="#241D12" stroke-width="0.5" shape-rendering="crispEdges" stroke-opacity="0.12"/><text x="880" y="1224" font-family="PingFang SC, Noto Sans SC, &quot;Helvetica Neue&quot;, sans-serif" font-size="26" font-weight="400" fill="#241D12" text-anchor="end" fill-opacity="0.55">有据</text></svg>