<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><rect width="1080" height="1440" fill="#EFE9DC"/><rect x="0" y="0" width="1080" height="1440" fill="#EFE9DC"/><text x="200" y="371.04" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#241D12" text-anchor="start">第一次装修最大的</text><text x="200" y="486.56" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#241D12" text-anchor="start">教训是：灯光方案</text><text x="200" y="602.08" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#241D12" text-anchor="start">必须在水电改造前</text><text x="200" y="717.6" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#241D12" text-anchor="start">定下来。等吊顶封</text><text x="200" y="833.12" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#241D12" text-anchor="start">好再想加射灯，</text><text x="200" y="948.64" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#241D12" text-anchor="start">只能在石膏板上开</text><text x="200" y="1064.16" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#241D12" text-anchor="start">槽，多花两千块，…</text><line x1="200" y1="1176" x2="880" y2="1176" stroke="#241D12" stroke-width="1" shape-rendering="crispEdges" stroke-opacity="0.22"/><line x1="200" y1="1186" x2="880" y2="1186" stroke="#241D12" stroke-width="0.5" shape-rendering="crispEdges" stroke-opacity="0.12"/><text x="880" y="1224" font-family="PingFang SC, Noto Sans SC, &quot;Helvetica Neue&quot;, sans-serif" font-size="26" font-weight="400" fill="#241D12" text-anchor="end" fill-opacity="0.55">有据</text></svg>