<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><rect width="1080" height="1440" fill="#111214"/><rect x="0" y="0" width="1080" height="1440" fill="#111214"/><text x="200" y="391.04" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#F2EDE3" text-anchor="start">第一次装修最大的教</text><text x="200" y="506.56" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#F2EDE3" text-anchor="start">训是：灯光方案必须</text><text x="200" y="622.08" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#F2EDE3" text-anchor="start">在水电改造前定下</text><text x="200" y="737.6" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#F2EDE3" text-anchor="start">来。等吊顶封好再想</text><text x="200" y="853.12" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#F2EDE3" text-anchor="start">加射灯，只能在石膏</text><text x="200" y="968.64" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#F2EDE3" text-anchor="start">板上开槽，多花两千</text><text x="200" y="1084.16" font-family="Songti SC, Noto Serif SC, serif" font-size="76" font-weight="400" fill="#F2EDE3" text-anchor="start">块，还留下一条补…</text><line x1="176" y1="320" x2="176" y2="1140" stroke="#C8A96A" stroke-width="1" shape-rendering="crispEdges" stroke-opacity="0.7"/><text x="896" y="1224" font-family="PingFang SC, Noto Sans SC, &quot;Helvetica Neue&quot;, sans-serif" font-size="26" font-weight="400" fill="#F2EDE3" text-anchor="end" fill-opacity="0.5">有据</text></svg>