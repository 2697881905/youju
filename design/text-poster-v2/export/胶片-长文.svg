<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><rect width="1080" height="1440" fill="#111214"/><rect x="0" y="0" width="1080" height="1440" fill="#111214"/><text x="200" y="385.67999999999995" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#F2EDE3" text-anchor="start">第一次装修最大的教训</text><text x="200" y="485.52" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#F2EDE3" text-anchor="start">是：灯光方案必须在水</text><text x="200" y="585.36" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#F2EDE3" text-anchor="start">电改造前定下来。</text><text x="200" y="685.2" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#F2EDE3" text-anchor="start">等吊顶封好再想加射</text><text x="200" y="785.0400000000001" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#F2EDE3" text-anchor="start">灯，只能在石膏板上开</text><text x="200" y="884.8800000000001" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#F2EDE3" text-anchor="start">槽，多花两千块，</text><text x="200" y="984.7200000000001" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#F2EDE3" text-anchor="start">还留下一条补不平的</text><text x="200" y="1084.5600000000002" font-family="Songti SC, Noto Serif SC, serif" font-size="64" font-weight="400" fill="#F2EDE3" text-anchor="start">缝。</text><line x1="176" y1="320" x2="176" y2="1140" stroke="#C8A96A" stroke-width="1" shape-rendering="crispEdges" stroke-opacity="0.7"/><text x="200" y="268" font-family="PingFang SC, Noto Sans SC, &quot;Helvetica Neue&quot;, sans-serif" font-size="26" font-weight="400" fill="#C8A96A" text-anchor="start" fill-opacity="0.42" letter-spacing="6">FILM · NO.01</text><text x="896" y="1224" font-family="PingFang SC, Noto Sans SC, &quot;Helvetica Neue&quot;, sans-serif" font-size="26" font-weight="400" fill="#F2EDE3" text-anchor="end" fill-opacity="0.5">有据</text></svg>