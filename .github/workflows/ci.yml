name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'entry/src/main/module.json5'
      - 'entry/src/main/resources/rawfile/agconnect-services.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'entry/src/main/module.json5'
      - 'entry/src/main/resources/rawfile/agconnect-services.json'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Type-check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify AGC release identity
        env:
          AGC_PACKAGE_NAME: ${{ vars.AGC_PACKAGE_NAME }}
          AGC_APP_ID: ${{ vars.AGC_APP_ID }}
          AGC_OAUTH_CLIENT_ID: ${{ vars.AGC_OAUTH_CLIENT_ID }}
          AGC_CONFIG_CLIENT_ID: ${{ vars.AGC_CONFIG_CLIENT_ID }}
          HUAWEI_CLIENT_ID: ${{ vars.HUAWEI_CLIENT_ID }}
        run: npm run check:agc

      - name: Verify release configuration
        run: npm run check:release-config

  smoke:
    name: API Full-chain Smoke
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: youju
          MYSQL_USER: youju
          MYSQL_PASSWORD: youju
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: test
      PORT: '3000'
      DATABASE_URL: mysql://youju:youju@127.0.0.1:3306/youju
      JWT_SECRET: ci-only-secret-not-for-production
      BASE: http://127.0.0.1:3000/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare database schema
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Start API and run full-chain smoke
        run: |
          npx tsx src/index.ts &
          API_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null; then break; fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:3000/health > /dev/null; then
            echo 'API 未能启动，查看服务日志'; kill $API_PID; exit 1
          fi
          set +e
          npm run test:smoke
          STATUS=$?
          kill $API_PID
          exit $STATUS
